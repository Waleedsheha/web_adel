server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ---- compression --------------------------------------------------------
    gzip_static     on;   # serve the *.gz baked into the image
    gzip            on;   # on-the-fly fallback for anything not precompressed
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml
               font/ttf font/otf application/octet-stream;

    # ---- misc ---------------------------------------------------------------
    client_max_body_size 1m;
    etag on;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }

    # ---- .mjs is missing from nginx's mime.types (.wasm is present) ----------
    location ~ \.mjs$ {
        default_type text/javascript;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # ---- never cache: filenames are stable but contents change every build ---
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|version\.json|manifest\.json)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ---- engine: only changes on a Flutter SDK bump, 37 MB, cache hard -------
    location ^~ /canvaskit/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ---- app assets: stable names, so revalidate daily -----------------------
    location ~* ^/(assets|icons|splash)/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ---- SPA fallback -------------------------------------------------------
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
